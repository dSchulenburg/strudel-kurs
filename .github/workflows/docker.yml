name: Build & push Docker image

# Push a multi-arch image to Docker Hub when a version tag is pushed (e.g. v1.0.0),
# or manually via the Actions tab. Requires two repo secrets:
#   DOCKERHUB_USERNAME  – your Docker Hub user (e.g. dadalama)
#   DOCKERHUB_TOKEN     – a Docker Hub access token (Account Settings -> Security)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: dadalama/strudel-kurs
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE=/
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
